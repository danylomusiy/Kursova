<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Львів-Тех — Панель менеджера 2.0</title>
    <style>
        :root { 
            --orange: #ff6c00; 
            --dark: #2d2d2d; 
            --red: #ff4d4d; 
            --green: #28a745; 
            --light-bg: #f0f2f5;
        }
        body { font-family: 'Inter', sans-serif; background: var(--light-bg); padding: 20px; color: var(--dark); margin: 0; }
        
        .container { max-width: 1200px; margin: 20px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--orange); padding-bottom: 15px; margin-bottom: 20px; }
        .header-flex h1 { margin: 0; font-size: 26px; font-weight: 800; }

        .stats-bar { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--dark); color: white; padding: 15px 25px; border-radius: 8px; flex: 1; text-align: left; }
        .stat-card span { display: block; font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
        .stat-card strong { font-size: 24px; color: var(--orange); font-weight: 800; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; padding: 15px; text-align: left; font-size: 13px; color: #666; border-bottom: 2px solid #eee; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; vertical-align: middle; }

        input, select, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; box-sizing: border-box; font-size: 14px; }
        .input-price { width: 110px; font-weight: bold; color: var(--orange); }
        .input-stock { width: 80px; text-align: center; font-weight: bold; }

        .low-stock { background: #fff0f0; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; display: inline-block; }
        .badge-low { background: var(--red); color: white; }
        .badge-ok { background: var(--green); color: white; }

        .btn-save { background: var(--orange); color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-save:hover { transform: translateY(-1px); background: #e66100; box-shadow: 0 4px 12px rgba(255,108,0,0.2); }
        .btn-orders { background: var(--dark); }
        .btn-orders:hover { background: #1a1a1a; }
        .btn-add { background: var(--green); }
        .btn-add:hover { background: #218838; }
        .btn-delete { background: var(--red); margin-left: 5px; }
        .btn-delete:hover { background: #d93838; }

        /* Модальні вікна */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000; }
        .modal-content { background: white; width: 90%; max-width: 650px; margin: 50px auto; padding: 30px; border-radius: 12px; position: relative; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; margin-top: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #555; }
        
        .order-item { border: 1px solid #eef0f2; padding: 20px; border-radius: 10px; background: #fff; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .btn-action { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; margin-right: 8px; transition: 0.2s; }
        .btn-complete { background: var(--green); }
        .btn-complete:hover { background: #218838; }
        .btn-cancel { background: var(--red); }
        .btn-cancel:hover { background: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h1>Панель Менеджера «Львів-Тех»</h1>
        <div>
            <button class="btn-save btn-add" onclick="openAddModal()">✚ Додати інструмент</button>
            <button class="btn-save btn-orders" onclick="openOrders()">📦 Замовлення</button>
            <button class="btn-save" style="background:#6c757d;" onclick="init()">🔄 Оновити дані</button>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-card">
            <span>Загальна вартість складу</span>
            <strong id="totalValue">0 ₴</strong>
        </div>
        <div class="stat-card">
            <span>Товари в дефіциті (&lt; 5 шт)</span>
            <strong id="lowStockCount" style="color: var(--red);">0</strong>
        </div>
        <div class="stat-card">
            <span>Всього найменувань</span>
            <strong id="totalItems">0</strong>
        </div>
    </div>

    <table id="stockTableMain">
        <thead>
            <tr>
                <th>Фото</th>
                <th>Товар / Модель</th>
                <th>Категорія</th>
                <th>Ціна (₴)</th>
                <th>Залишок (шт)</th>
                <th>Статус склада</th>
                <th style="width: 180px;">Дії</th>
            </tr>
        </thead>
        <tbody id="stockTable"></tbody>
    </table>
</div>

<div id="addProductModal" class="modal">
    <div class="modal-content">
        <span style="position:absolute; right:25px; top:20px; cursor:pointer; font-size:24px; color:#aaa;" onclick="closeAddModal()">✕</span>
        <h2 style="border-bottom: 2px solid var(--green); padding-bottom: 10px; margin-top: 0; text-align: left;">Новий інструмент в реєстр</h2>
        
        <div class="form-grid">
            <div class="form-group">
                <label>Категорія інструменту *</label>
                <select id="newCat">
                    <option value="1">🔋 Акумуляторний інструмент</option>
                    <option value="2">🔌 Мережевий інструмент</option>
                </select>
            </div>
            <div class="form-group">
                <label>Потужність / Напруга</label>
                <input type="text" id="newPower" placeholder="Напр: 20V або 1200 Вт">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Назва моделі інструменту *</label>
                <input type="text" id="newModelName" placeholder="Напр: Шуруповерт серії ЛТ-Брешлес">
            </div>
            <div class="form-group">
                <label>Ціна продажу (грн) *</label>
                <input type="number" id="newPrice" placeholder="0">
            </div>
            <div class="form-group">
                <label>Початковий залишок на складі (шт)</label>
                <input type="number" id="newStock" value="10">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Технічний опис для клієнта</label>
                <textarea id="newDesc" rows="3" placeholder="Опишіть переваги, комплектацію та гарантійні умови..."></textarea>
            </div>
        </div>
        
        <div style="margin-top: 25px; text-align: right; border-top: 1px solid #eee; padding-top:15px;">
            <button class="btn-save" style="background:#888; margin-right: 5px;" onclick="closeAddModal()">Скасувати</button>
            <button class="btn-save btn-add" onclick="saveNewProduct()">Зберегти в БД</button>
        </div>
    </div>
</div>

<div id="ordersModal" class="modal">
    <div class="modal-content" style="max-width: 850px;">
        <span style="position:absolute; right:25px; top:20px; cursor:pointer; font-size:24px; color:#aaa;" onclick="closeOrders()">✕</span>
        <h2 style="border-bottom: 2px solid var(--orange); padding-bottom: 10px; margin-top:0; text-align: left;">Стрічка активних замовлень</h2>
        <div id="ordersList" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:3000';

    // --- 1. ЗАВАНТАЖЕННЯ ТА ТАБЛИЦЯ ТОВАРІВ ---
    async function init() {
        try {
            const res = await fetch(`${API_BASE}/products`);
            const data = await res.json();
            
            let totalVal = 0;
            let lowCount = 0;

            document.getElementById('stockTable').innerHTML = data.map(item => {
                const currentId = item.id;
                const price = parseFloat(item.price) || 0;
                const stock = parseInt(item.stock_quantity) || 0;
                const isLow = stock < 5;
                
                totalVal += price * stock;
                if(isLow) lowCount++;

                return `
                    <tr class="${isLow ? 'low-stock' : ''}">
                        <td>
                            <img src="${API_BASE}/img/${currentId}.png" style="width: 45px; height: 45px; object-fit: contain;" onerror="this.src='https://via.placeholder.com/45?text=LT'">
                        </td>
                        <td>
                            <strong style="font-size:15px;">${item.model_name}</strong><br>
                            <small style="color:#888; font-weight:600;">${item.power_value || 'Без специфікації'} | ID: #${currentId}</small>
                        </td>
                        <td><span style="font-size:13px; color:#555; font-weight:500;">${item.cat_name}</span></td>
                        <td><input type="number" class="input-price" id="p-${currentId}" value="${price}"></td>
                        <td><input type="number" class="input-stock" id="s-${currentId}" value="${stock}"></td>
                        <td>
                            <span class="badge ${isLow ? 'badge-low' : 'badge-ok'}">
                                ${isLow ? 'Дефіцит' : 'ОК'}
                            </span>
                        </td>
                        <td>
                            <button class="btn-save" onclick="update(${currentId})">Зберегти</button>
                            <button class="btn-save btn-delete" onclick="deleteProduct(${currentId})">✕</button>
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('totalValue').innerText = totalVal.toLocaleString() + " ₴";
            document.getElementById('lowStockCount').innerText = lowCount;
            document.getElementById('totalItems').innerText = data.length;
        } catch (e) {
            console.error("Помилка завантаження складу:", e);
        }
    }

    // Швидке оновлення ціни та кількості менеджером
    async function update(id) {
        const price = parseFloat(document.getElementById(`p-${id}`).value);
        const stock = parseInt(document.getElementById(`s-${id}`).value);

        try {
            const res = await fetch(`${API_BASE}/admin/update-product/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ price, stock })
            });
            if(res.ok) init();
        } catch(e) {
            alert("Не вдалося оновити параметри інструменту.");
        }
    }

    // Видалення товару
    async function deleteProduct(id) {
        if(!confirm(`Ви впевнені, що хочете видалити товар ID #${id} з бази даних?`)) return;
        try {
            const res = await fetch(`${API_BASE}/admin/delete-product/${id}`, { method: 'DELETE' });
            if(res.ok) {
                init();
            } else {
                const err = await res.json();
                alert("Помилка: " + err.error);
            }
        } catch (e) {
            alert("Сервер не відповідає.");
        }
    }

    // --- 2. ДОДАННЯ НОВОГО ІНСТРУМЕНТУ ---
    async function saveNewProduct() {
        const category_id = parseInt(document.getElementById('newCat').value);
        const model_name = document.getElementById('newModelName').value.trim();
        const power_value = document.getElementById('newPower').value.trim();
        const price = parseFloat(document.getElementById('newPrice').value);
        const stock_quantity = parseInt(document.getElementById('newStock').value);
        const description = document.getElementById('newDesc').value.trim();

        if (!model_name || isNaN(price) || price <= 0) {
            return alert("Будь ласка, вкажіть назву моделі та коректну ціну.");
        }

        const newProductData = { category_id, model_name, power_value, price, stock_quantity, description };

        try {
            const res = await fetch(`${API_BASE}/admin/add-product`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newProductData)
            });

            if (res.ok) {
                alert("Новий інструмент успішно внесено до бази даних!");
                closeAddModal();
                // Очищення форми
                document.getElementById('newModelName').value = '';
                document.getElementById('newPower').value = '';
                document.getElementById('newPrice').value = '';
                document.getElementById('newDesc').value = '';
                init();
            } else {
                const err = await res.json();
                alert("Помилка: " + err.error);
            }
        } catch(e) {
            alert("Помилка відправки запиту на сервер.");
        }
    }

    // --- 3. СТРІЧКА ТА КЕРУВАННЯ ЗАМОВЛЕННЯМИ ---
    async function openOrders() {
        document.getElementById('ordersModal').style.display = 'block';
        try {
            const res = await fetch(`${API_BASE}/admin/orders-list`);
            const orders = await res.json();
            const list = document.getElementById('ordersList');
            
            if (orders.length === 0) {
                list.innerHTML = "<p style='color:#777; font-weight:600;'>Активних замовлень у черзі немає.</p>";
                return;
            }

            list.innerHTML = orders.map(o => {
                const names = o.items_names ? o.items_names.split('||') : [];
                const ids = o.items_ids ? o.items_ids.split('||') : [];
                
                const itemsHtml = names.map((name, index) => `
                    <div style="display:flex; align-items:center; margin-bottom:6px; padding:6px 0; border-bottom:1px dashed #eee;">
                        <img src="${API_BASE}/img/${ids[index]}.png" style="width:35px; height:35px; object-fit:contain; margin-right:10px;" onerror="this.src='https://via.placeholder.com/35?text=LT'">
                        <span style="font-size:13.5px; font-weight:600; color:#333;">${name}</span>
                    </div>
                `).join('');

                return `
                    <div class="order-item">
                        <div style="text-align: left;">
                            <div style="display:flex; justify-content:between; align-items:center; margin-bottom:12px;">
                                <span style="font-size:16px; font-weight:800; flex-grow:1;">Замовлення #${o.order_id}</span>
                                <span style="font-weight:800; color:var(--orange); font-size:13px; letter-spacing:0.5px;">[${o.status.toUpperCase()}]</span>
                            </div>
                            
                            <div style="background:#fafafa; padding:10px; border-radius:6px; margin: 10px 0;">${itemsHtml}</div>
                            
                            <div style="font-size:13px; color:#555; line-height:1.5;">
                                Кому: <b>${o.first_name} ${o.last_name}</b> | Тел: <b>${o.phone}</b><br>
                                Доставка: <b>${o.address}</b>
                            </div>
                            
                            <div style="margin-top:12px; font-size:16px; font-weight:800; color:var(--dark);">
                                Разом до сплати: <span style="color:var(--orange);">${parseFloat(o.total_amount).toLocaleString()} ₴</span>
                            </div>
                            
                            <div style="margin-top:15px; border-top:1px solid #f2f2f2; padding-top:12px;">
                                ${o.status === 'Нове' ? `
                                    <button class="btn-action btn-complete" onclick="changeStatus('complete', ${o.order_id})">✓ Виконано</button>
                                    <button class="btn-action btn-cancel" onclick="changeStatus('cancel', ${o.order_id})">✕ Скасувати</button>
                                ` : `<b style="color:#999; font-size:13px;">Обробку завершено зі статусом: ${o.status}</b>`}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        } catch (e) {
            console.error(e);
        }
    }

    async function changeStatus(type, id) {
        try {
            const res = await fetch(`${API_BASE}/admin/orders/${type}/${id}`, { method: 'POST' });
            if(res.ok) {
                openOrders();
                init();
            }
        } catch(e) {
            alert("Не вдалося змінити статус замовлення.");
        }
    }

    // Модалки візуальні
    function openAddModal() { document.getElementById('addProductModal').style.display = 'block'; }
    function closeAddModal() { document.getElementById('addProductModal').style.display = 'none'; }
    function closeOrders() { document.getElementById('ordersModal').style.display = 'none'; }

    // Старт роботи
    init();
    // Автооновлення кожні 15 секунд для відстеження нових замовлень
    setInterval(init, 15000);
</script>
</body>
</html>
